name: Deployment foundation (opt-in)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment (both run Production)
        type: choice
        options: [dev, prod]
        default: dev
      phase:
        description: Plan is local-only; other phases require environment approval and explicit enablement
        type: choice
        options: [plan, foundation, build-images, application]
        default: plan
      apply:
        description: Allow paid mutation (otherwise foundation/application run what-if; builds remain read-only)
        type: boolean
        default: false
      api_image:
        description: Application phase only - full ACR called-it-api@sha256:digest
        type: string
        default: ''
      workers_image:
        description: Application phase only - full ACR called-it-workers@sha256:digest
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deployment-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Local-only validation (no login or mutation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pinned Bicep
        run: az bicep install --version v0.48.1
      - name: Compile with non-secret fixtures and test preflight/policy
        run: python3 infra/scripts/validate.py --bicep "$HOME/.azure/bin/bicep"
      - name: State the no-op boundary
        run: python3 infra/scripts/deploy.py --phase plan

  azure:
    name: Explicit ${{ inputs.phase }} (${{ inputs.environment }})
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.phase != 'plan' }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PHASE: ${{ inputs.phase }}
      ENVIRONMENT: ${{ inputs.environment }}
      APPLY: ${{ inputs.apply }}
      AZURE_DEPLOY_ENABLED: ${{ vars.AZURE_DEPLOY_ENABLED }}
      AZURE_ENVIRONMENT_APPROVAL_CONFIGURED: ${{ vars.AZURE_ENVIRONMENT_APPROVAL_CONFIGURED }}
      AZURE_COST_APPROVED: ${{ vars.AZURE_COST_APPROVED }}
      AZURE_FOUNDATION_APPROVED: ${{ vars.AZURE_FOUNDATION_APPROVED }}
      SQL_BOOTSTRAP_APPROVED: ${{ vars.SQL_BOOTSTRAP_APPROVED }}
      APPLICATION_ROLLOUT_APPROVED: ${{ vars.APPLICATION_ROLLOUT_APPROVED }}
      PUSH_CONFIGURATION_APPROVED: ${{ vars.PUSH_CONFIGURATION_APPROVED }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'calledit' }}
      SQL_ENTRA_ADMIN_OBJECT_ID: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      SQL_ENTRA_ADMIN_LOGIN: ${{ vars.SQL_ENTRA_ADMIN_LOGIN }}
      SQL_ENTRA_ADMIN_PRINCIPAL_TYPE: ${{ vars.SQL_ENTRA_ADMIN_PRINCIPAL_TYPE || 'Group' }}
      SQL_ALLOWED_CLIENT_IPS: ${{ vars.SQL_ALLOWED_CLIENT_IPS || '[]' }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      API_IMAGE: ${{ inputs.api_image }}
      WORKERS_IMAGE: ${{ inputs.workers_image }}
      APPLICATION_REVISION_SUFFIX: r${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_SIGNING_KEY_SECRET_URI: ${{ vars.AUTH_SIGNING_KEY_SECRET_URI }}
      CONTACTS_PEPPER_SECRET_URI: ${{ vars.CONTACTS_PEPPER_SECRET_URI }}
      SOCIAL_AUTH_APPLE_AUDIENCE: ${{ vars.SOCIAL_AUTH_APPLE_AUDIENCE }}
      SOCIAL_AUTH_GOOGLE_AUDIENCE: ${{ vars.SOCIAL_AUTH_GOOGLE_AUDIENCE }}
      PUSH_PROVIDER: ${{ vars.PUSH_PROVIDER || 'Disabled' }}
      NOTIFICATION_HUB_NAME: ${{ vars.NOTIFICATION_HUB_NAME }}
      NOTIFICATION_HUB_CONNECTION_SECRET_URI: ${{ vars.NOTIFICATION_HUB_CONNECTION_SECRET_URI }}
      API_MIN_REPLICAS: ${{ vars.API_MIN_REPLICAS || '1' }}
      API_MAX_REPLICAS: ${{ vars.API_MAX_REPLICAS || '2' }}
      API_HTTP_CONCURRENT_REQUESTS: ${{ vars.API_HTTP_CONCURRENT_REQUESTS || '20' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject missing inputs/approval before Azure login
        run: |
          args=(--phase "$PHASE" --environment "$ENVIRONMENT" --check)
          if [[ "$APPLY" == 'true' ]]; then
            args+=(--apply)
          fi
          python3 infra/scripts/deploy.py "${args[@]}"

      - name: Azure login (environment-scoped OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up pinned Bicep
        run: az bicep install --version v0.48.1

      - name: Run only the explicitly selected phase
        run: |
          export BICEP="$HOME/.azure/bin/bicep"
          args=(--phase "$PHASE" --environment "$ENVIRONMENT" --execute)
          if [[ "$APPLY" == 'true' ]]; then
            args+=(--apply)
          fi
          python3 infra/scripts/deploy.py "${args[@]}"
