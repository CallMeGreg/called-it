name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod, test]
        default: dev
      test_action:
        description: TEST only; Start is explicit, Status never provisions
        type: choice
        options: [status, start, extend, stop]
        default: status
      test_run_id:
        description: Exact current TEST run ID for Extend or Stop
        type: string
        default: ''
      confirm_stop:
        description: For Stop, repeat the run ID after reviewing Status
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'Dockerfile.workers'
      - '.github/workflows/deploy.yml'

# OIDC federated login to Azure — no cloud passwords stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  test:
    name: Explicit TEST lifecycle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'test' }}
    uses: ./.github/workflows/deploy-test.yml
    with:
      action: ${{ inputs.test_action }}
      run_id: ${{ inputs.test_run_id }}
      confirm_stop: ${{ inputs.confirm_stop }}

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    # Auto-deploy on push only after CD is enabled (set the repository variable
    # AZURE_DEPLOY_ENABLED=true once environments + OIDC are configured). Manual
    # runs via "Run workflow" always proceed. See the manual-setup issue.
    if: ${{ github.event.inputs.environment != 'test' && (github.event_name == 'workflow_dispatch' || vars.AZURE_DEPLOY_ENABLED == 'true') }}
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # 1) Converge infrastructure (idempotent). Creates/updates ACR, SQL, Redis,
      #    Container Apps, etc. Secrets are supplied as environment variables that the
      #    .bicepparam file reads via readEnvironmentVariable(...).
      - name: Deploy infrastructure (Bicep)
        id: infra
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AUTH_SIGNING_KEY: ${{ secrets.AUTH_SIGNING_KEY }}
          CONTACTS_PEPPER: ${{ secrets.CONTACTS_PEPPER }}
          SQL_AAD_ADMIN_OBJECT_ID: ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
          SQL_AAD_ADMIN_LOGIN: ${{ vars.SQL_AAD_ADMIN_LOGIN }}
          ACS_FROM_NUMBER: ${{ vars.ACS_FROM_NUMBER }}
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "calledit-${ENVIRONMENT}-${{ steps.tag.outputs.sha }}" \
            --template-file infra/main.bicep \
            --parameters "infra/main.${ENVIRONMENT}.bicepparam" \
            --query properties.outputs -o json)
          echo "acrName=$(echo "$outputs"    | jq -r .acrName.value)"       >> "$GITHUB_OUTPUT"
          echo "apiName=$(echo "$outputs"    | jq -r .apiName.value)"       >> "$GITHUB_OUTPUT"
          echo "workersName=$(echo "$outputs"| jq -r .workersName.value)"   >> "$GITHUB_OUTPUT"
          echo "acrServer=$(echo "$outputs"  | jq -r .acrLoginServer.value)">> "$GITHUB_OUTPUT"
          echo "apiFqdn=$(echo "$outputs"    | jq -r .apiFqdn.value)"       >> "$GITHUB_OUTPUT"

      # 2) Build both images on the runner and push to ACR.
      #    We build here (rather than server-side via `az acr build`) because
      #    `az acr build` runs an ACR Tasks quick task, and some subscriptions
      #    block that with `TasksOperationsNotAllowed`. Pushing from the runner
      #    only needs data-plane push rights, which the deploy identity's
      #    Contributor role already grants. ubuntu-latest ships Docker/BuildKit.
      - name: Log in to ACR
        run: az acr login --name "${{ steps.infra.outputs.acrName }}"

      - name: Build and push API image
        env:
          ACR_SERVER: ${{ steps.infra.outputs.acrServer }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker build --file Dockerfile \
            --tag "$ACR_SERVER/called-it-api:$SHA" \
            --tag "$ACR_SERVER/called-it-api:latest" .
          docker push "$ACR_SERVER/called-it-api:$SHA"
          docker push "$ACR_SERVER/called-it-api:latest"

      - name: Build and push Workers image
        env:
          ACR_SERVER: ${{ steps.infra.outputs.acrServer }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker build --file Dockerfile.workers \
            --tag "$ACR_SERVER/called-it-workers:$SHA" \
            --tag "$ACR_SERVER/called-it-workers:latest" .
          docker push "$ACR_SERVER/called-it-workers:$SHA"
          docker push "$ACR_SERVER/called-it-workers:latest"

      # 3) Roll both Container Apps to the freshly built images.
      - name: Update API container app
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.apiName }}" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.infra.outputs.acrServer }}/called-it-api:${{ steps.tag.outputs.sha }}"

      - name: Update Workers container app
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.workersName }}" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.infra.outputs.acrServer }}/called-it-workers:${{ steps.tag.outputs.sha }}"

      - name: Summary
        run: |
          echo "### Deployed to ${ENVIRONMENT} :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://${{ steps.infra.outputs.apiFqdn }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ steps.tag.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
