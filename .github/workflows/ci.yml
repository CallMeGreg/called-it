name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CalledIt.sln

      - name: Build
        run: dotnet build CalledIt.sln -c Release --no-restore

      - name: Test
        run: dotnet test CalledIt.sln -c Release --no-build --verbosity normal

  validate-infra:
    name: Compile infrastructure and exercise local guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pinned Bicep (no Azure login)
        run: |
          az bicep install --version v0.48.1

      - name: Compile main, both parameter files and application; test deployment policy
        run: python3 infra/scripts/validate.py --bicep "$HOME/.azure/bin/bicep"
