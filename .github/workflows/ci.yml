name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CalledIt.sln

      - name: Build
        run: dotnet build CalledIt.sln -c Release --no-restore

      - name: Test
        run: dotnet test CalledIt.sln -c Release --no-build --filter "Category!=SqlServer" --verbosity normal

  sql-server:
    name: SQL Server migrations, permissions and queries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Generate ephemeral local SQL credentials
        shell: bash
        run: |
          password="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CALLEDIT_SQLSERVER_TEST_CONNECTION_STRING=Server=127.0.0.1,1433;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Start disposable SQL Server 2022 (no Azure)
        id: sql
        run: |
          docker run --detach --name calledit-ci-sql \
            --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD --env MSSQL_MEMORY_LIMIT_MB=2048 \
            mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090

      - name: Exercise real provider bootstrap, upgrades, constraints, queries and permissions
        run: dotnet test tests/CalledIt.SqlServer.Tests -c Release --verbosity normal --logger "trx;LogFileName=sqlserver.trx" --results-directory TestResults/sqlserver

      - name: Remove disposable SQL Server
        if: always() && steps.sql.outcome == 'success'
        run: docker rm --force calledit-ci-sql

  validate-infra:
    name: Compile infrastructure and exercise local guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pinned Bicep (no Azure login)
        run: |
          az bicep install --version v0.48.1

      - name: Compile main, both parameter files and application; test deployment policy
        run: python3 infra/scripts/validate.py --bicep "$HOME/.azure/bin/bicep"
