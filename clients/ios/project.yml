name: CalledIt
options:
  bundleIdPrefix: it.called
  deploymentTarget:
    iOS: "16.0"
targets:
  CalledIt:
    type: application
    platform: iOS
    sources:
      - CalledIt/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.called.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
